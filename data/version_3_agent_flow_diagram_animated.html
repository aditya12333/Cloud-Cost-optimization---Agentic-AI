<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Cost Decision Agent — Version 3 Flow</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f5fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 10%, rgba(113,84,216,.12), transparent 32%), radial-gradient(circle at 85% 90%, rgba(30,155,165,.12), transparent 34%), #f6f5fb; }
    main { width: min(96vw, 1100px); padding: 28px 0; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; color: #4f5a70; font-size: 14px; }
    button { appearance: none; border: 0; border-radius: 999px; background: #5f49c5; color: white; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(70,48,155,.18); }
    button:focus-visible { outline: 3px solid #9ee2da; outline-offset: 3px; }
    object { display: block; width: 100%; height: auto; aspect-ratio: 13 / 12; border-radius: 26px; box-shadow: 0 24px 70px rgba(43,35,82,.18); background: white; }
    @media (max-width: 560px) { .toolbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="toolbar"><span>Moving dots show how information travels through V3.</span><button id="motion-toggle" type="button" aria-pressed="false">Pause motion</button></div>
    <object id="flow-object" type="image/svg+xml" data="version_3_agent_flow_diagram.svg" aria-label="Animated Version 3 cloud cost decision-agent flow"></object>
  </main>
  <script>
    const button = document.getElementById('motion-toggle');
    const diagram = document.getElementById('flow-object');
    let paused = false;
    button.addEventListener('click', () => {
      const svgDocument = diagram.contentDocument;
      if (!svgDocument) return;
      const svgRoot = svgDocument.documentElement;
      const animatedLines = svgDocument.querySelectorAll('.flow-trace, .flow-trace-teal');
      paused = !paused;
      if (paused) { svgRoot.pauseAnimations(); animatedLines.forEach((line) => { line.style.animationPlayState = 'paused'; }); }
      else { svgRoot.unpauseAnimations(); animatedLines.forEach((line) => { line.style.animationPlayState = 'running'; }); }
      button.textContent = paused ? 'Play motion' : 'Pause motion';
      button.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>
